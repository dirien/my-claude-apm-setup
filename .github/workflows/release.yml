name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pin-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Pin README consumer example to the released tag
        run: |
          sed -i -E 's|#v[0-9]+\.[0-9]+\.[0-9]+|#'"${GITHUB_REF_NAME}"'|g' README.md

      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "README already pinned to ${GITHUB_REF_NAME}; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: pin consumer example to latest tag ${GITHUB_REF_NAME}"
          git push origin main
