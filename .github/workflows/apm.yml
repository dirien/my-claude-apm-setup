name: apm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install APM
        run: |
          curl -sSL https://aka.ms/apm-unix | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Reproduce pinned dependencies (npm-ci equivalent)
        run: apm install --frozen

      - name: Audit lockfile integrity
        run: apm audit --ci

      - name: Validate primitives
        run: apm compile -t claude,codex --validate

      # Note: the committed AGENTS.md / .claude/rules carry an APM-version stamp, so a
      # hard drift gate is intentionally left out of CI (it would trip whenever the runner's
      # APM is newer than the one that generated them). Run `make check` locally to catch
      # real content drift. CI enforces the version-robust gates: frozen install + audit.

      - name: Export agent-dependency SBOM
        run: |
          mkdir -p sbom
          TS="$(git log -1 --format=%cI)"
          apm lock export -f cyclonedx --timestamp "$TS" -o sbom/agents.cdx.json
          apm lock export -f spdx      --timestamp "$TS" -o sbom/agents.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-sbom
          path: sbom/
