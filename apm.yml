# apm.yml — Microsoft APM manifest for a self-contained Claude Code + Codex setup.
#
# Reproduce the whole agent setup with:
#   apm install --frozen         # resolve the pinned skill deps, wire MCP/LSP/hooks
#   apm compile -t claude,codex  # (re)generate agent context from .apm/instructions/
#
# Everything here runs on APM + standard tooling — no extra binary required.
#
#   Install APM:  curl -sSL https://aka.ms/apm-unix | sh   (or: brew install microsoft/apm/apm)

name: my-claude-apm-setup
version: 0.6.0
description: A self-contained APM-managed Claude Code + Codex setup — pinned skills, agents, guardrail hooks, MCP, LSP, and single-source generated context.
author: Engin Diri
license: MIT

# Metadata passthrough → lands verbatim in the .claude-plugin/plugin.json that `apm pack` emits.
homepage: https://github.com/dirien/my-claude-apm-setup
repository: https://github.com/dirien/my-claude-apm-setup
keywords:
  - claude-code
  - codex
  - agent-package-manager
  - developer-setup
  - go

# Two agents, nothing else. APM writes each one's native layout:
#   claude -> .claude/ + .claude/rules/      codex -> .codex/ + AGENTS.md
targets:
  - claude
  - codex

# Pin compile behaviour so every contributor and CI run emits identical files.
compilation:
  strategy: distributed          # scoped instructions land next to the code they apply to
  exclude:
    - "apm_modules/**"           # keep vendored deps out of placement scoring

dependencies:
  # Skills resolved from git, pinned to a commit so the manifest is self-describing
  # (apm.lock.yaml pins the same SHAs; `apm install --frozen` reproduces them).
  apm:
    # jeffallan/claude-skills — language & role
    - jeffallan/claude-skills/skills/golang-pro#1be15d8064f88fc25216442406d40add8fd23b53
    - jeffallan/claude-skills/skills/cli-developer#1be15d8064f88fc25216442406d40add8fd23b53
    - jeffallan/claude-skills/skills/devops-engineer#1be15d8064f88fc25216442406d40add8fd23b53
    # rshade/agent-skills — Go tooling & repo hygiene
    - rshade/agent-skills/skills/agent-ready-go#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - rshade/agent-skills/skills/go-fix#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - rshade/agent-skills/skills/lint-fix#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - rshade/agent-skills/skills/commitlint#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - rshade/agent-skills/skills/markdownlint#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - rshade/agent-skills/skills/actionlint#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - rshade/agent-skills/skills/shellcheck#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - rshade/agent-skills/skills/go-nolint-audit#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - rshade/agent-skills/skills/tech-debt#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - rshade/agent-skills/skills/security-audit#a24f44a048452d157c4dd5913e8f80020b5ffe0a
    - jeffallan/claude-skills/skills/code-reviewer#1be15d8064f88fc25216442406d40add8fd23b53
    - jeffallan/claude-skills/skills/architecture-designer#1be15d8064f88fc25216442406d40add8fd23b53
    # netresearch/agent-rules-skill — keep AGENTS.md / .claude/rules in sync
    - netresearch/agent-rules-skill/skills/agent-rules#1fb399373792e7e0a9966cdfb201ae192fe95347
    # mattpocock/skills — plan stress-testing (grilling is model-invoked, grill-me is the /grill-me entry point)
    - mattpocock/skills/skills/productivity/grilling#49dd158d1076134a641b33efb035946536778336
    - mattpocock/skills/skills/productivity/grill-me#49dd158d1076134a641b33efb035946536778336
    # pulumi/agent-skills — the official Pulumi skills (only the pulumi/ plugin, not
    # delegation/migration/package-maintenance)
    - pulumi/agent-skills/pulumi/skills/package-usage#2517e28e4bc029424e9c9ee48016394296be0f6a
    - pulumi/agent-skills/pulumi/skills/provider-upgrade#2517e28e4bc029424e9c9ee48016394296be0f6a
    - pulumi/agent-skills/pulumi/skills/pulumi-automation-api#2517e28e4bc029424e9c9ee48016394296be0f6a
    - pulumi/agent-skills/pulumi/skills/pulumi-best-practices#2517e28e4bc029424e9c9ee48016394296be0f6a
    - pulumi/agent-skills/pulumi/skills/pulumi-component#2517e28e4bc029424e9c9ee48016394296be0f6a
    - pulumi/agent-skills/pulumi/skills/pulumi-debug-failed-operation#2517e28e4bc029424e9c9ee48016394296be0f6a
    - pulumi/agent-skills/pulumi/skills/pulumi-esc#2517e28e4bc029424e9c9ee48016394296be0f6a
    - pulumi/agent-skills/pulumi/skills/pulumi-overview#2517e28e4bc029424e9c9ee48016394296be0f6a
    # antonbabenko/terraform-skill — Terraform/OpenTofu authoring, review and debugging
    - antonbabenko/terraform-skill/skills/terraform-skill#0a3a4a66e99001347d36a41e10260a825be3ab62
    # antonbabenko/agent-plugins — code-intelligence, terraform-skill's recommended
    # companion (LSP-first code navigation guidance). Pinned straight at the
    # skill folder: the plugin root has no apm.yml/SKILL.md of its own (just a
    # commands/ dir apm doesn't install), and newer apm CLIs reject a bare
    # plugin-root path instead of auto-descending into skills/<name> like 0.28 did.
    - antonbabenko/agent-plugins/plugins/code-intelligence/skills/code-intelligence#807f273fc8b7055c1d0f402d841c1f092f1cd09a
    # wshobson/agents — ShellCheck configuration & static-analysis workflow
    # (the shell-scripting plugin's one skill we use)
    - wshobson/agents/plugins/shell-scripting/skills/shellcheck-configuration#46891e7e60da0e52baf1050b7b6391b64e84c6d9
    # sickn33/agentic-awesome-skills — huge community skill catalog; pinning only
    # typescript-expert (deep TS/JS type-level programming, perf, monorepos)
    - sickn33/agentic-awesome-skills/skills/typescript-expert#a3072641b750a1fb2f6ce695a5f984ea3d4c3ec1
    # addyosmani/clarity — reader-facing prose: co-write, rewrite, review, lint.
    # Its SKILL.md sits at the repo root like humanizer's, but apm resolves that
    # shape again (checked on 0.28 through 0.33), so it stays a pinned dep
    # rather than a vendored copy. apm deploys the whole repo, site/ and
    # samples/ included (~2.3 MB); there is no file-level prune option.
    - addyosmani/clarity#e27ceeff60368cf6966b4ea00a5b9b36418ee9a0

  # MCP servers, self-defined (registry: false) so install never hits a registry.
  mcp:
    # Pulumi's hosted MCP (OAuth on first use) — registry, code validation, Neo.
    - name: pulumi
      registry: false
      transport: http
      url: https://mcp.ai.pulumi.com/mcp

  # LSP servers. APM writes .lsp.json; install the binaries yourself:
  #   go install golang.org/x/tools/gopls@latest
  #   npm i -g typescript typescript-language-server · pip install pyright · dotnet tool install -g csharp-ls
  lsp:
    - name: gopls
      command: gopls
      args: ["serve"]
      extensionToLanguage:
        ".go": go
    - name: typescript-language-server
      command: typescript-language-server
      args: ["--stdio"]
      extensionToLanguage:
        ".ts": typescript
        ".tsx": typescriptreact
    - name: pyright
      command: pyright-langserver
      args: ["--stdio"]
      extensionToLanguage:
        ".py": python
    - name: csharp
      command: csharp-ls
      extensionToLanguage:
        ".cs": csharp

# Note on devDependencies: APM supports a `devDependencies:` block (dev-only skills,
# excluded from `apm pack`). I kept all 19 skills as regular dependencies instead, because
# `apm audit --ci` flags dev entries as "orphaned" in a production (`apm install --frozen`)
# install — the CI gate deploys only runtime deps, so the locked dev entries look undeployed.
# See docs/APM-ADOPTION.md.

# Local primitives under .apm/, discovered automatically:
#   .apm/instructions/*.instructions.md → .claude/rules/ (claude) + AGENTS.md (codex)
#   .apm/skills/{commit,docs-pr,pr,review}/ → four built-in skills
#   .apm/agents/{executor,librarian,reviewer}.md → three subagents
#   .apm/hooks/guardrails.json          → PreToolUse command guard + PostToolUse format/secret-scan
#       (self-contained shell scripts under scripts/ — no external binary needed)
#   .apm/hooks/rtk.json                 → PreToolUse rtk rewrite (token savings; see below)
includes: auto

# rtk (https://github.com/rtk-ai/rtk) — a CLI proxy that compresses command output
# before the agent reads it. Two halves, both declared here so the setup stays
# self-contained and no consumer has to run `rtk init`:
#   * .apm/hooks/rtk.json installs the PreToolUse hook. It runs scripts/rtk-hook.sh,
#     which skips Claude Code worktrees (.claude/worktrees/, where isolation refuses
#     `rtk git ...`; rtk-ai/rtk#3864) and otherwise calls `rtk hook claude` (a native
#     subcommand — do NOT vendor the legacy hooks/claude/rtk-rewrite.sh, which rtk
#     deletes on sight and nags about). The hook only rewrites; it returns no
#     permissionDecision, so it cannot auto-approve anything and the guardrail
#     hook's deny still wins (Claude Code merges hooks most-restrictive-first).
#   * this post-install step fetches the pinned binary into ~/.local/bin.
# Lifecycle scripts are trust-gated: `apm install` SKIPS this (with a warning)
# until someone runs `apm lifecycle trust` once per machine. That is deliberate —
# it is the escape hatch for anyone who wants the hooks without the binary. The
# hook no-ops when rtk is absent, so an untrusted install is still fully working,
# just without the token savings.
lifecycle:
  post-install:
    - type: command
      description: "Install the pinned rtk CLI into ~/.local/bin (token-saving command proxy)"
      command: "sh ./scripts/install-rtk.sh"
      timeoutSec: 120
    # Colored status line (dir, git branch, model, context use). Claude Code has no
    # APM primitive for statusLine, so this copies scripts/statusline.sh to
    # ~/.claude/apm-statusline.sh and points settings.json at it, leaving a
    # user-configured statusLine alone. APM_STATUSLINE=0 opts out.
    - type: command
      description: "Install the colored Claude Code status line into ~/.claude"
      command: "sh ./scripts/install-statusline.sh"
      timeoutSec: 30

# Convenience wrapper. `apm run sync` regenerates the agent context from .apm/instructions.
scripts:
  sync: "apm compile -t claude,codex --clean"
